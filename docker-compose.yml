services:
    minio:
        image: quay.io/minio/minio
        container_name: local-minio
        ports:
            - "9002:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio123
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        networks:
            - local
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: local-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - local
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped

    postgres:
        image: pgvector/pgvector:pg18
        container_name: local-postgres
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
            - local
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped

    postgres-omni:
        image: google/alloydbomni:17.10.0
        container_name: postgres-omni
        ports:
            - "5432:5432"
        environment:
            POSTGRES_PASSWORD: postgres
        shm_size: 1g
        mem_limit: 4g
        volumes:
            - alloydb_data:/var/lib/postgresql/data
        networks:
            - local
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    opensearch:
        image: opensearchproject/opensearch:latest
        container_name: local-opensearch
        ports:
            - "9200:9200"
            - "9600:9600"
        environment:
            discovery.type: single-node
            DISABLE_INSTALL_DEMO_CONFIG: "true"
            DISABLE_SECURITY_PLUGIN: "true"
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - opensearch_data:/usr/share/opensearch/data
        networks:
            - local
        healthcheck:
            test: [ "CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped

    opensearch-dashboards:
        image: opensearchproject/opensearch-dashboards:3.8.0
        container_name: opensearch-dashboards
        ports:
            - "5601:5601"
        environment:
            OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
            DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
        depends_on:
            - opensearch
        networks:
            - local

networks:
    local:
        driver: bridge

volumes:
    minio_data:
    redis_data:
    postgres_data:
    alloydb_data:
    opensearch_data:
